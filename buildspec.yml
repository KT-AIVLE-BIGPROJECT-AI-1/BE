version: 0.2

phases:
  install:
    commands:
      - echo "Install phase"
      # Gradle wrapper 실행 권한 보장
      - chmod +x ./gradlew
  build:
    commands:
      - echo "Build phase"
      - ./gradlew clean test
      - ./gradlew bootJar

artifacts:
  files:
    # Spring Boot JAR 산출물
    - build/libs/*.jar